<template>
    <lightning-card>
        <template if:true={isOpen}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="modal-heading" class="slds-text-heading_medium">{title}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_small">
                        <template if:true={isLoading}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </template>

                        <template if:false={isLoading}>
                            <lightning-datatable
                                key-field="Id"
                                data={rows}
                                columns={columns}
                                hide-checkbox-column>
                            </lightning-datatable>
                        </template>

                        <template if:true={error}>
                            <div class="slds-text-color_error slds-m-top_small">Error loading records</div>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Close" onclick={close}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
