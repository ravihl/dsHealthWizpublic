<template> 

    <lightning-card title="Top 10 Data Storage Usage" icon-name="utility:database"> 

        <div class="slds-p-around_medium"> 

 

<div class="slds-text-title_caps slds-m-bottom_x-small"> 

                Org Data Storage Used: {percentUsed}% ({totalUsedMB} MB of {orgLimitMB} MB) 

            </div> 

 

            <!-- Standard Progress Bar --> 

            <lightning-progress-bar value={percentUsed} size="large"></lightning-progress-bar> 

        </div>     

 

        <div class="slds-p-around_small"> 

            <lightning-button 

                label="Capture Current Snapshot" 

                variant="brand" 

                onclick={handleCapture} 

                class="slds-m-bottom_small"> 

            </lightning-button> 

        </div> 

 

        <template if:true={data}> 

            <lightning-datatable 

                key-field="Id" 

                data={data} 

                columns={columns} 

                hide-checkbox-column="true"> 

            </lightning-datatable> 

        </template> 

 

        <template if:true={error}> 

            <div class="slds-text-color_error slds-p-around_small"> 

                {error} 

            </div> 

        </template> 

    </lightning-card> 

</template>
